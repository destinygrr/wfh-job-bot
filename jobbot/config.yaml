# ============================================================
#  WFH JOB BOT  -  SETTINGS FILE
#  Edit in GitHub: click the file -> pencil icon -> edit -> Commit.
#  Keep the quotes " " and the dashes - exactly as they are.
# ============================================================

# ---- WHAT TO SEARCH ---------------------------------------
#  Every job type is WORK-FROM-HOME ONLY, except "School Teacher",
#  which is the one exception you asked for:
#      location: "Hyderabad"   -> only Hyderabad jobs
#      allow_onsite: true      -> on-site / in-person school jobs are allowed
profiles:

  # 1) AI TRAINER  (work from home only)
  - name: "AI Trainer"
    enabled: true
    keywords:
      - "AI trainer"
    apna_categories:
      - "work-from-home-jobs"

  # 2) ONLINE TEACHING / TUTORING  (work from home only)
  - name: "Online Teaching"
    enabled: true
    keywords:
      - "online teacher"
      - "online tutor"
    apna_categories:
      - "online-teaching-jobs"
      - "tutor-jobs"
      - "work-from-home-jobs"

  # 3) SCHOOL TEACHER  -  THE EXCEPTION: Hyderabad only, on-site allowed
  - name: "School Teacher (Hyderabad)"
    enabled: true
    location: "Hyderabad"        # only jobs whose location says Hyderabad
    allow_onsite: true           # on-site school jobs are allowed for this type
    keywords:
      - "school teacher"
    apna_categories:
      - "teacher-jobs"

  # 4) DOCUMENTS VERIFICATION / KYC  (work from home only)
  - name: "Document Verification (KYC)"
    enabled: true
    keywords:
      - "document verification"
      - "documents verification"
      - "document verification executive"
      - "verification executive"
      - "verification officer"
      - "document verifier"
      - "kyc verification"
      - "kyc executive"
      - "kyc analyst"
      - "background verification"
      - "onboarding kyc"
      - "customer verification"
      - "verification specialist"
      - "record verification"
    apna_categories:
      - "work-from-home-jobs"

  # 5) STOCK MARKET / EQUITY RESEARCH  (work from home only)
  - name: "Stock Market Research"
    enabled: true
    keywords:
      - "derivatives analyst"
    apna_categories:
      - "work-from-home-jobs"

  # 6) PURCHASE / SUPPLY CHAIN  -  FULL TIME, HYDERABAD only
  #    (this one is NOT work-from-home: on-site / hybrid Hyderabad jobs are wanted)
  - name: "Purchase & Supply Chain (Hyderabad)"
    enabled: true
    location: "Hyderabad"        # only jobs whose location says Hyderabad
    allow_onsite: true           # full-time on-site / hybrid jobs are allowed
    keywords:
      - "purchase"
      - "procurement"
      - "material"
      - "sourcing"
      - "supply chain"
      - "warehouse"
      - "logistics"
      - "inventory"
      - "AI P2P automation"
      - "agentic AI agent development"
    apna_categories:
      - "purchase-jobs"
      - "procurement-jobs"
      - "supply-chain-jobs"
      - "warehouse-jobs"
      - "logistics-jobs"
      - "material-management-jobs"

  # 7) INTERNATIONAL WORK-FROM-HOME  (US, Canada, Australia, Europe, Singapore, UAE)
  #    Remote jobs only. Jobs that need local work authorisation
  #    ("US citizen", "green card", "must reside in UK"...) are dropped automatically.
  - name: "International WFH"
    enabled: true
    locations:                   # searched 2 at a time, rotating each run
      - "United States"
      - "Canada"
      - "Australia"
      - "United Kingdom"
      - "Germany"
      - "Netherlands"
      - "Singapore"
      - "United Arab Emirates"
    keywords:
      - "AI trainer"
      - "data annotation"
      - "AI testing"
      - "software testing"
      - "online tutor"
      - "document verification"
      - "equity research"
    apna_categories: []          # apna is India-only, so nothing here

# ---- WHERE ------------------------------------------------
location: "India"                # default for every job type (School Teacher overrides its own)
remote_only: true                # true = work-from-home only, for all types except those
                                 # with "allow_onsite: true" (i.e. School Teacher)

# ---- SOURCES YOU WANT TO SEARCH ---------------------------
sources:
  linkedin:  true     # works everywhere (incl. free cloud)
  apna:      true     # works everywhere
  naukri:    true     # usually blocked from cloud IPs; works best from home Wi-Fi
  remotive:  true     # free global remote-jobs API (bonus)
  jobicy:    true     # free global remote-jobs API (bonus)
  jooble:    false    # turn ON only after you add a free JOOBLE_API_KEY

# ---- JOB QUALITY RULES (age-friendly, scam-safe) ----------
filters:
  exclude_fresher_only: true     # skip "Freshers only" / 0-year jobs
  exclude_internships:  true     # skip internships
  exclude_commission_only: true  # skip "commission only" agent jobs
  min_salary_lpa: 0              # 0 = don't filter by salary, else e.g. 4
  max_age_days: 30               # only jobs posted in the last N days
  max_jobs_per_source: 200       # cap so a run stays fast
  drop_authorization_required: true   # drop foreign jobs needing US/UK/EU work permits

  # YOUR PERSONAL BLOCK LIST ------------------------------------------------
  # Any job whose TITLE / COMPANY / LOCATION contains one of these words is
  # silently dropped (case is ignored). Add a new line to switch one on:
  blocklist: []
    # - "german"              # no German-language teaching roles
    # - "malayalam"
    # - "walk-in"             # no walk-in interview drives
    # - "insurance agent"
    # - "field sales"         # nothing needing field visits
    # - "telecaller"
    # - "night shift"

# ---- YOUR DETAILS (used to write ready-to-paste cover notes) ----
applicant:
  name: "Gnyanneshwar Rao"
  experience: "20+ years"        # e.g. "15 years", "over 20 years"
  highlights:                    # your strengths, comma-separated inside the note
    - "procurement, supply chain and operations"
    - "software testing and AI evaluation"
  skill_map:                     # which skill line to use for each job type
    default:  "procurement, supply chain, sourcing and operations"
    Teaching: "teaching, tutoring and mentoring students"
    AI:       "software testing, QA and AI model evaluation"
    KYC:      "documentation, KYC verification and compliance"
    Stock:    "equity research, financial analysis and derivatives"
    International: "remote collaboration, AI data work and analysis"

# ---- GMAIL JOB-EMAIL ALERTS --------------------------------
# WhatsApp alerts for job-related emails in your Gmail inbox.
# Setup: Google Account -> Security -> 2-Step Verification ON, then
# https://myaccount.google.com/apppasswords -> create "wfh-bot" -> copy the
# 16-character password into the GitHub secret GMAIL_APP_PASSWORD.
gmail:
  enabled: true
  lookback_days: 3             # only look at emails from the last N days
  max_per_alert: 8             # how many emails per WhatsApp message
  job_senders:                 # emails from these domains are treated as job-related
    - "linkedin.com"
    - "naukri.com"
    - "apna.co"
    - "indeed.com"
    - "foundit.in"
    - "hirist.com"
    - "instahyre.com"
    - "glassdoor.com"
    - "iimjobs.com"
    - "naukrigulf.com"
    - "timesjobs.com"
  subject_keywords:            # ...and any email whose subject contains these words
    - "job"
    - "application"
    - "interview"
    - "opportunity"
    - "recruiter"
    - "hiring"
    - "shortlist"
    - "vacancy"
    - "opening"
  exclude_subjects:            # never alert about these
    - "newsletter"
    - "webinar"
    - "promotion"
    - "course"

# ---- ALERT SETTINGS ---------------------------------------
alerts:
  max_jobs_per_alert: 50         # send ALL matching jobs in one message (no more queueing)
  min_trust_score: 55            # 0-100. Jobs below this are NOT alerted (0 = send everything)
  heartbeat_daily: true          # once a day send "bot is alive" even if 0 new jobs

  # ---- which channels to use (all free) ----
  ntfy:     true                 # instant phone notification, easiest + most reliable
  telegram: true                 # Telegram bot — never rate-limited
  greenapi: true                 # REAL WhatsApp from your own number (free plan)
  whatsapp: false                # CallMeBot — unreliable since 2025, enable only if yours works
  email:    false                # optional e-mail copy

# ---- FILE LOCATIONS (usually no need to change) -----------
state_file:  "data/seen_jobs.json"
digest_html: "data/latest_digest.html"
digest_md:   "data/latest_digest.md"
